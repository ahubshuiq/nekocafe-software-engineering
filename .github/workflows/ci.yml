name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_PASSWORD: test_password
  REDIS_PASSWORD: changeme

jobs:
  # ========== 1. 代码检查（Lint） ==========
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查预约服务 Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/reservation/Dockerfile

      - name: 检查会员服务 Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/member/Dockerfile

      - name: 检查 YAML 文件
        run: pip install yamllint && yamllint -c .yamllint.yml .github/ infra/k8s/ docker-compose.yml

  # ========== 2. 单元测试（Unit Test） ==========
  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nekocafe
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: nekocafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nekocafe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PostgreSQL 客户端
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: 创建测试数据库
        run: |
          PGPASSWORD=test_password psql -h localhost -U nekocafe -d nekocafe -c "CREATE DATABASE nekocafe_reservation;" || true
          PGPASSWORD=test_password psql -h localhost -U nekocafe -d nekocafe -c "CREATE DATABASE nekocafe_member;" || true
        env:
          PGPASSWORD: test_password

      - name: 初始化数据库表
        run: |
          # 预约库：建表 + 种子数据
          PGPASSWORD=test_password psql -h localhost -U nekocafe -d nekocafe_reservation -c "
          CREATE TABLE IF NOT EXISTS dining_table (
            id SERIAL PRIMARY KEY, store_id INTEGER NOT NULL, table_number VARCHAR(10) NOT NULL,
            capacity INTEGER NOT NULL, zone VARCHAR(32), status VARCHAR(20) NOT NULL DEFAULT 'IDLE'
          );
          CREATE TABLE IF NOT EXISTS reservation (
            id SERIAL PRIMARY KEY, member_id INTEGER NOT NULL, store_id INTEGER NOT NULL,
            table_id INTEGER NOT NULL, reservation_date DATE NOT NULL, start_time TIME NOT NULL,
            end_time TIME NOT NULL, guest_count INTEGER NOT NULL, cat_preference VARCHAR(128),
            status VARCHAR(20) NOT NULL DEFAULT 'PENDING', deposit_amount DECIMAL(10,2),
            created_at TIMESTAMP NOT NULL DEFAULT NOW(), cancel_reason VARCHAR(256)
          );
          INSERT INTO dining_table (store_id, table_number, capacity, zone) VALUES
            (1, 'A1', 4, '撸猫区'), (1, 'A2', 2, '撸猫区'), (1, 'B1', 6, '主题包间'),
            (1, 'B2', 8, '主题包间'), (1, 'C1', 4, '窗边区')
          ON CONFLICT DO NOTHING;
          "
          # 会员库：建表
          PGPASSWORD=test_password psql -h localhost -U nekocafe -d nekocafe_member -c "
          CREATE TABLE IF NOT EXISTS member (
            id SERIAL PRIMARY KEY, name VARCHAR(64) NOT NULL, phone VARCHAR(20) UNIQUE NOT NULL,
            email VARCHAR(128), avatar VARCHAR(256), level VARCHAR(20) NOT NULL DEFAULT 'NORMAL',
            points INTEGER NOT NULL DEFAULT 0, total_spent DECIMAL(12,2) NOT NULL DEFAULT 0,
            preferences JSONB, created_at TIMESTAMP NOT NULL DEFAULT NOW(), updated_at TIMESTAMP NOT NULL DEFAULT NOW()
          );
          "
        env:
          PGPASSWORD: test_password

      # --- 预约服务（Python） ---
      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 测试预约服务
        working-directory: services/reservation
        env:
          DATABASE_URL: postgresql://nekocafe:test_password@localhost:5432/nekocafe_reservation
          REDIS_URL: redis://localhost:6379/0
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

      # --- 会员服务（Node.js） ---
      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/member/package-lock.json

      - name: 测试会员服务
        working-directory: services/member
        env:
          DATABASE_URL: postgresql://nekocafe:test_password@localhost:5432/nekocafe_member
          REDIS_URL: redis://localhost:6379/1
        run: |
          npm ci
          npm test

  # ========== 3. 静态安全扫描（SAST） ==========
  sast:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python

      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v3

  # ========== 4. 构建镜像（Build） ==========
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: [unit-test, sast]
    strategy:
      matrix:
        service: [reservation, member]
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 缓存 Docker 构建层
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-${{ matrix.service }}
          key: ${{ runner.os }}-buildx-${{ matrix.service }}-${{ hashFiles(format('services/{0}/**', matrix.service)) }}
          restore-keys: ${{ runner.os }}-buildx-${{ matrix.service }}-

      - name: 构建镜像
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          load: true
          tags: nekocafe/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.service }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.service }}-new,mode=max

      - name: 保存镜像
        run: docker save nekocafe/${{ matrix.service }}:${{ github.sha }} | gzip > /tmp/${{ matrix.service }}.tar.gz

      - name: 上传镜像产物
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar.gz

      - name: 更新缓存
        run: |
          rm -rf /tmp/.buildx-cache-${{ matrix.service }}
          mv /tmp/.buildx-cache-${{ matrix.service }}-new /tmp/.buildx-cache-${{ matrix.service }}

  # ========== 5. 镜像安全扫描（Container Scan） ==========
  container-scan:
    name: 镜像安全扫描
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [reservation, member]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp

      - name: 加载镜像
        run: docker load < /tmp/${{ matrix.service }}.tar.gz

      - name: 下载 Trivy 漏洞数据库（带重试）
        run: |
          for i in 1 2 3; do
            docker run --rm aquasec/trivy:latest image --download-db-only && break
            echo "第 $i 次下载失败，等待 10 秒后重试..."
            sleep 10
          done

      - name: Trivy 漏洞扫描
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nekocafe/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ========== 6. 集成测试（Integration Test） ==========
  integration-test:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: 下载镜像
        uses: actions/download-artifact@v4
        with:
          path: /tmp

      - name: 加载镜像
        run: |
          docker load < /tmp/image-reservation/reservation.tar.gz
          docker load < /tmp/image-member/member.tar.gz

      - name: 启动完整栈
        run: docker compose up -d
        env:
          DB_PASSWORD: test_password

      - name: 等待服务就绪
        run: sleep 30

      - name: 健康检查
        run: |
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:3000/health

      - name: API 冒烟测试
        run: |
          curl -sf http://localhost:8000/api/reservations/available?store_id=1\&reservation_date=$(date +%Y-%m-%d)\&guest_count=2
          curl -sf http://localhost:3000/api/members/99999 || true

      - name: 清理环境
        if: always()
        run: docker compose down -v

  # ========== 7. 推送镜像（Push Image） ==========
  push-image:
    name: 推送镜像
    runs-on: ubuntu-latest
    needs: [container-scan, integration-test]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [reservation, member]
    permissions:
      packages: write
    steps:
      - name: 下载镜像
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp

      - name: 加载镜像
        run: docker load < /tmp/${{ matrix.service }}.tar.gz

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 打标签并推送
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/nekocafe/${{ matrix.service }}
          docker tag nekocafe/${{ matrix.service }}:${{ github.sha }} ${IMAGE}:${{ github.sha }}
          docker tag nekocafe/${{ matrix.service }}:${{ github.sha }} ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
