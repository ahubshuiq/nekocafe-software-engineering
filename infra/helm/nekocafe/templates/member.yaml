{{- if .Values.member.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member
  namespace: {{ include "nekocafe.namespace" . }}
  labels:
    app: member
    {{- include "nekocafe.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.member.replicas }}
  selector:
    matchLabels:
      app: member
  template:
    metadata:
      labels:
        app: member
    spec:
      containers:
        - name: member
          image: "{{ .Values.member.image }}:{{ .Values.member.tag }}"
          ports:
            - containerPort: {{ .Values.member.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nekocafe-secrets
                  key: member-db-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nekocafe-secrets
                  key: redis-url-member
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.member.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.member.port }}
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml .Values.member.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: member
  namespace: {{ include "nekocafe.namespace" . }}
spec:
  selector:
    app: member
  ports:
    - port: {{ .Values.member.port }}
      targetPort: {{ .Values.member.port }}
{{- if .Values.member.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: member-hpa
  namespace: {{ include "nekocafe.namespace" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: member
  minReplicas: {{ .Values.member.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.member.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.member.autoscaling.targetCPUUtilization }}
{{- end }}
{{- end }}
