apiVersion: apps/v1
kind: Deployment
metadata:
  name: member
  namespace: nekocafe
  labels:
    app: member
spec:
  replicas: 2
  selector:
    matchLabels:
      app: member
  template:
    metadata:
      labels:
        app: member
    spec:
      containers:
        - name: member
          image: nekocafe/member:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nekocafe-secrets
                  key: member-db-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nekocafe-secrets
                  key: redis-url-member
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: member
  namespace: nekocafe
spec:
  selector:
    app: member
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: member-pdb
  namespace: nekocafe
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: member
