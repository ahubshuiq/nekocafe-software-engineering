apiVersion: v1
kind: Secret
metadata:
  name: nekocafe-secrets
  namespace: nekocafe
type: Opaque
stringData:
  db-password: "CHANGE_ME"
  reservation-db-url: "postgresql://nekocafe:CHANGE_ME@postgres:5432/nekocafe_reservation"
  member-db-url: "postgresql://nekocafe:CHANGE_ME@postgres:5432/nekocafe_member"
  redis-url-reservation: "redis://redis:6379/0"
  redis-url-member: "redis://redis:6379/1"
