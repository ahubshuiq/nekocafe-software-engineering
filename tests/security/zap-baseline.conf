# OWASP ZAP Baseline 扫描配置
# 规则格式: rule_id  action  description
# action: IGNORE (忽略) / WARN (警告) / FAIL (阻断)
#
# 参考: https://www.zaproxy.org/docs/docker/baseline-scan/

# ── 信息性告警（忽略） ──────────────────────────────────────
10015	IGNORE	Re-examine Cache-control Directives
10017	IGNORE	X-Frame-Options Header
10019	IGNORE	X-Content-Type-Options Header
10020	IGNORE	X-XSS-Protection Header
10021	IGNORE	X-Debugging-Information
10035	IGNORE	Strict-Transport-Security Header
10036	IGNORE	Server Leaks Version Info via "Server" HTTP Response Header
10037	IGNORE	Server Leaks X-Powered-By HTTP Response Header
10038	IGNORE	Content Security Policy (CSP) Header Not Set
10098	IGNORE	Cross-Domain Misconfiguration
10109	IGNORE	Modern Web Application
10202	IGNORE	Absence of Anti-CSRF Tokens

# ── 预约服务 API 已知安全配置 ──────────────────────────────
# 已通过 SecurityHeadersMiddleware 设置了 X-Content-Type-Options,
# X-Frame-Options, Referrer-Policy，故以下规则忽略
10038	IGNORE	CSP Header — 已通过中间件设置基本安全头

# ── 低风险警告（保留警告，不阻断构建） ──────────────────────
10016	WARN	Web Browser XSS Protection Not Enabled
10036	WARN	Server Leaks Version Info
10063	WARN	Feature Policy Header Not Set

# ── 高风险规则（FAIL 阻断） ────────────────────────────────
40012	FAIL	Cross Site Scripting (Reflected)
40014	FAIL	Cross Site Scripting (Persistent)
40018	FAIL	SQL Injection
40019	FAIL	SQL Injection (MySQL)
40020	FAIL	SQL Injection (Hypersonic)
40021	FAIL	SQL Injection (Oracle)
40022	FAIL	SQL Injection (PostgreSQL)
40024	FAIL	SQL Injection (SQLite)
90022	FAIL	Application Error Disclosure
90033	FAIL	Loosely Scoped Cookie

# ── 通用忽略 ──────────────────────────────────────────────
10049	IGNORE	Storable and Cacheable Content
10050	IGNORE	Retrieved from Cache
10110	IGNORE	Dangerous JS Functions
